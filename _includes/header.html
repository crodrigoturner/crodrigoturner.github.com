<header class="site-header">
  <button class="hamburger" aria-label="Open menu" onclick="var h=this.closest('.site-header');h.classList.toggle('open');this.setAttribute('aria-label',h.classList.contains('open')?'Close menu':'Open menu')">
    <span></span><span></span><span></span>
  </button>
  <div class="site-header-inner">
    <img class="logo" src="/images/logo.png">
    <h1><a href="/" class="site-logo">Carlos Rodrigo</a></h1>
    <nav class="site-nav">
      <ul>
        

{% assign pages = site.pages | sort: 'url' %}
{% for p in pages %}
 
    {% unless p.url contains '_drafts' or p.url contains 'feed' or p.url contains '404' or p.url contains 'README' %}
  <li><a href="{{ p.url }}"{% if page.url == p.url %} class="current"{% endif %}>{{ p.title }}</a></li>
    {% endunless %}

{% endfor %}
</ul>
        
     
    </nav>

  

  </div>
</header>
