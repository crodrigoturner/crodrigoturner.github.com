<header>
<h1><a href="/" class="logo">Carlos Rodrigo</a></h1>
<nav>
<ul>
{% assign nav_pages = site.pages | where_exp: "p", "p.nav_order" | sort: "nav_order" %}
{% for p in nav_pages %}
<li><a href="{{ p.url }}"{% if page.url == p.url %} class="active"{% endif %}>{{ p.title }}</a></li>
{% endfor %}
{% for item in site.data.navigation %}
<li><a href="{{ item.link }}">{{ item.name }}</a></li>
{% endfor %}
</ul>
</nav>
<a class="contact" href="mailto:rodrigoturner.carlos@gmail.com">Get in touch <span class="arrow">-></span></a><hr/>
</header>
