<header>
<nav>
<ul>
<li><h1><a href="/"><span class="logo"></span></a> Carlos Rodrigo</h1></li>
<li><a href="/about/"{% if page.url contains '/about/' %} class="current"{% endif %}>About</a></li>
<!--<li><a href="/blog"{% if page.url contains '/blog/' %}  class="current"{% endif %}>Blog</a></li>-->
<li><a href="/projects/"{% if page.url contains '/projects/' %} class="current"{% endif %}>Projects</a></li>
<li><a href="/work/"{% if page.url contains '/work/' %} class="current"{% endif %}>Work</a></li>
<li><a href="/contact/"{% if page.url contains '/contact/' %} class="current"{% endif %} >Contact</a></li>
</ul>
<ul class="filter">
    <li class="filter-btn is-checked" data-filter="*">all</li>
  {% for tag in site.tags %}
  <li class="filter-btn" data-filter=".tag-{{ tag[0] | slugify }}">{{ tag[0] }}</li>
  {% endfor %}
</ul>


</nav>
</header>

<script src="https://unpkg.com/isotope-layout@3/dist/isotope.pkgd.min.js"></script>
<script>
var iso = new Isotope(".fullwidth", {
  layoutMode: "fitRows",
  itemSelector: "article",
  percentPosition: true
});
document.querySelectorAll(".filter-btn").forEach(function (btn) {
  btn.addEventListener("click", function () {
    document.querySelectorAll(".filter-btn").forEach(function (b) {
      b.classList.remove("is-checked");
    });
    btn.classList.add("is-checked");
    var f = btn.getAttribute("data-filter");
    iso.arrange({
      filter: f === "*" ? "*" : function (el) {
        return el.classList.contains(f.slice(1)) || el.classList.contains("personal");
      }
    });
  });
});
</script>
