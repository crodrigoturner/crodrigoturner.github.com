{%- comment -%}
  Contact form (Formspree). Set `formspree_id` in _config.yml.
  Usage: {% include contact-form.html %}
{%- endcomment -%}
<form class="contact-form" id="contact-form"
      action="https://formspree.io/f/{{ site.formspree_id }}" method="POST">

  <div class="cf-field">
    <label for="cf-name">Name</label>
    <input id="cf-name" type="text" name="name" autocomplete="name" required>
  </div>

  <div class="cf-field">
    <label for="cf-email">Email</label>
    <input id="cf-email" type="email" name="email" autocomplete="email" required>
  </div>

  <div class="cf-field">
    <label for="cf-subject">Subject <span class="cf-optional">(optional)</span></label>
    <input id="cf-subject" type="text" name="subject" value="{{ include.subject }}">
  </div>

  <div class="cf-field">
    <label for="cf-message">Message</label>
    <textarea id="cf-message" name="message" rows="7" required></textarea>
  </div>

  {%- comment -%} Spam trap: real people never fill this in {%- endcomment -%}
  <input type="text" name="_gotcha" tabindex="-1" autocomplete="off" class="cf-hp" aria-hidden="true">
  <input type="hidden" name="_subject" value="New message from {{ site.title | default: 'your site' }}">
  <input type="hidden" name="page" value="{{ page.url | absolute_url }}">

  <button type="submit" class="cf-button">Send message</button>
  <p class="cf-status" role="status" aria-live="polite"></p>
</form>

<script>
(function () {
  var form = document.getElementById('contact-form');
  if (!form || !window.fetch) return;            // no JS → normal POST to Formspree
  var status = form.querySelector('.cf-status');
  var button = form.querySelector('button');

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    button.disabled = true;
    button.textContent = 'Sending…';
    status.className = 'cf-status';
    status.textContent = '';

    fetch(form.action, {
      method: 'POST',
      body: new FormData(form),
      headers: { 'Accept': 'application/json' }
    }).then(function (res) {
      if (res.ok) {
        form.reset();
        status.classList.add('cf-ok');
        status.textContent = "Thanks! Your message is on its way — I'll get back to you soon.";
      } else {
        return res.json().then(function (data) {
          throw new Error(data.errors ? data.errors.map(function (x) { return x.message; }).join(', ') : 'Error');
        });
      }
    }).catch(function () {
      status.classList.add('cf-error');
      status.textContent = 'Something went wrong. Please try again, or email me directly.';
    }).finally(function () {
      button.disabled = false;
      button.textContent = 'Send message';
    });
  });
})();
</script>
