{% assign book_posts = site.tags.reviews | sort: 'date' | reverse %}

{% for post in book_posts %}
<a href="{{ post.url }}">
{% if post.cover %}
<img src="{{ post.cover }}" alt="{{ post.title }}" loading="lazy">
{% else %}
<h3>{{ post.title }}</h3>
<p>{{ post.excerpt | strip_html | truncatewords: 30 }}</p>
{% endif %}
</a>
{% endfor %}
