<!DOCTYPE html>
<html lang="{{ page.lang }}">
<head>
<meta charset="utf-8">
<title>{% if page.metatitle %}{{page.url}} / {{page.metatitle}}{% elsif page.title%}Carlos Rodrigo / {{page.title}}{% else %}Carlos Rodrigo{% endif %}</title>
<meta name="description" content="Carlos Rodrigo">
<link href="/style.css" rel="stylesheet">
<link rel="icon" href="/images/favicon.png" />
<meta name="viewport" content="width=device-width">
<link rel="alternate" type="application/rss+xml" href="/feed.xml" />
<script src="https://unpkg.com/isotope-layout@3/dist/isotope.pkgd.min.js"></script>
<script>
(function () {
// Last.fm
fetch(
"https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks" +
"&user=crodrigoturner&api_key=3c7221c1a33da2e9e202e546d4fc36f2&format=json&limit=1"
)
.then(function (r) { return r.json(); })
.then(function (data) {
var tracks = data.recenttracks.track;
var track  = Array.isArray(tracks) ? tracks[0] : tracks;
var now    = track["@attr"] && track["@attr"].nowplaying === "true";
document.getElementById("lastfm-track").innerHTML =
(now ? "&#9834; " : "") + "<i>" + track.name + "</i> by " + track.artist["#text"];
})
.catch(function () { document.getElementById("lastfm-track").textContent = "music"; });
})();
</script>
</head>
<body id="{{page.id}}">
