{% assign project_posts = site.tags.projects | sort: 'date' | reverse %}
<div class="masonry">
{% for post in project_posts %}
<a class="masonry-item" href="{{ post.url }}">
{% if post.cover %}<img src="{{ post.cover }}" alt="{{ post.title }}" loading="lazy">{% endif %}
<h3>{{ post.title }}</h3>
<p>{{ post.excerpt | strip_html | truncatewords: 30 }}</p>
<span class="more">Read more <span class="arrow">-></span></span>
</a>
{% endfor %}
</div>
