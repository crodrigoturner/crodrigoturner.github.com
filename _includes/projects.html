<div class="projects">

{% assign project_posts = site.tags.projects | sort: 'date' | reverse %}

{% for post in project_posts %}
<a class="col-20" href="{{ post.url }}">
{% if post.cover %}
<img src="{{ post.cover }}" alt="{{ post.title }}" loading="lazy">
{% else %}
<h3>{{ post.title }}</h3>
<p>{{ post.excerpt | strip_html | truncatewords: 30 }}</p>
{% endif %}
</a>
{% endfor %}
</div>
