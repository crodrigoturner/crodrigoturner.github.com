{% assign garden_limit = include.limit | default: site.posts.size %}
<div class="garden">
{% for post in site.posts limit: garden_limit %}
<a class="garden-item" href="{{ post.url }}">
<div class="garden-card">
<h3>{{ post.title }}</h3>
{% if post.excerpt %}<p class="garden-description">{{ post.excerpt | strip_html | truncatewords: 20 }}</p>{% endif %}

</div>
</a>
{% endfor %}
</div>

<script>
// swap the printed date for "3 months ago", like the garden does
(function () {
  if (!window.Intl || !Intl.RelativeTimeFormat) return;
  var rtf = new Intl.RelativeTimeFormat("en", { numeric: "auto" });
  var units = [["year", 31536000], ["month", 2592000], ["week", 604800], ["day", 86400]];
  document.querySelectorAll(".meta time").forEach(function (el) {
    var seconds = (new Date(el.getAttribute("datetime")) - new Date()) / 1000;
    for (var i = 0; i < units.length; i++) {
      if (Math.abs(seconds) >= units[i][1] || units[i][0] === "day") {
        el.textContent = rtf.format(Math.round(seconds / units[i][1]), units[i][0]);
        break;
      }
    }
  });
})();
</script>
