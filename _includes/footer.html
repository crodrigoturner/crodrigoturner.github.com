<footer>
  
  <img src="/images/deepwander.png" class="deepwander" alt="Deepwander logo">
  
  <p id="random-quote"></p>


<script>
  (function () {
    var quotes = [
      "This too shall pass",
      "Live well, tell no one"
    ];
    var el = document.getElementById("random-quote");
    if (el) el.textContent = quotes[Math.floor(Math.random() * quotes.length)];
  })();
</script></footer>
