<footer>
  

 <p><span class="marquee-track"><span id="random-quote"></span> · Made with care from Madrid · <span id="current-datetime"></span> · Carlos R. Rodrigo Turner</span></p>


<script>
  (function () {
    var quotes = [
      "This too shall pass",
      "Live well, tell no one"
    ];
    var el = document.getElementById("random-quote");
    if (el) el.textContent = quotes[Math.floor(Math.random() * quotes.length)];
  })();
</script>
<script>
(function () {
// Current date/time, live
var el = document.getElementById("current-datetime");
function pad(n) { return String(n).padStart(2, "0"); }
function tick() {
var d = new Date();
el.textContent =
d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) +
pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
}
tick();
setInterval(tick, 1000);
})();
</script>

</footer>

</body>
</html>
