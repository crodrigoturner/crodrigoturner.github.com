{% comment %} no visible footer: this include only fills the sidebar quote and clock and closes the page {% endcomment %}
<script>
(function () {
  // random quote
  var quotes = [
    "This too shall pass",
    "Live well, tell no one"
  ];
  var quote = document.getElementById("random-quote");
  if (quote) quote.textContent = quotes[Math.floor(Math.random() * quotes.length)];

  // current date/time, live
  var clock = document.getElementById("current-datetime");
  if (!clock) return;
  function pad(n) { return String(n).padStart(2, "0"); }
  function tick() {
    var d = new Date();
    clock.textContent =
      d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) +
      pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds());
  }
  tick();
  setInterval(tick, 1000);
})();
</script>

</body>
</html>
