name: Deploy Jekyll

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # ubuntu-latest moved to 26.04, which has no Ruby 3.1 build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'

      - name: Install dependencies
        run: |
          bundle lock --add-platform x86_64-linux
          bundle install --jobs 4 --retry 3

      # the API key has full account access, so it stays in a secret and only the step counts reach the site
      - name: Fetch intervals.icu steps
        env:
          INTERVALS_ATHLETE_ID: ${{ secrets.INTERVALS_ATHLETE_ID }}
          INTERVALS_API_KEY: ${{ secrets.INTERVALS_API_KEY }}
        run: |
          mkdir -p _data
          echo '[]' > _data/steps.json
          if [ -n "$INTERVALS_API_KEY" ]; then
            curl -sf -u "API_KEY:$INTERVALS_API_KEY" \
              "https://intervals.icu/api/v1/athlete/${INTERVALS_ATHLETE_ID:-0}/wellness?oldest=$(date -u -d '371 days ago' +%F)&newest=$(date -u +%F)" \
              | jq '[.[] | select(.steps != null) | {date: .id, steps: .steps}]' > _data/steps.tmp \
              && mv _data/steps.tmp _data/steps.json \
              || echo "Could not fetch steps, building without them"
          fi

      - name: Build Jekyll
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: './_site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
