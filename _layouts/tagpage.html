{% include head.html %}<div class="site-layout">
{% include header.html %}
<section>
    <article>
<h2>Posts tagged {{ page.tag }}</h2>

<ul class="bulleted">
{% for post in site.tags[page.tag] %}
  <li>
    {{ post.date | date: "%B %d, %Y" }}: <a href="{{ post.url }}">{{ post.title }}</a>
  </li>
{% endfor %}
</ul>
</article></section>
</div>
