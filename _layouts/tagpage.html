{% include head.html %}
{% include header.html %}
<section>
{% include tagcloud.html %}

<h2>{{ page.tag }}</h2>

{% for post in site.tags[page.tag] %}
<article class="post {{ post.tags }}">
  <h3><a href="{{ post.url }}">{{ post.title }}</a></h3>
{{post.content}}
<span class="meta">{{post.tags}} · {{ post.date | date: '%Y%m%d' }} · <a href="mailto:rodrigoturner.carlos@gmail.com?subject={{ post.title }}">Reply by email</a></span>
</article>

{% endfor %}

</section>
