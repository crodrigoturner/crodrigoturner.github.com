{% include head.html %}
{% include header.html %}

<section>
  <h2>Blog</h2>
<ul class="archive">
{% assign all_posts = site.posts | sort: 'date' | reverse %}
{% for post in all_posts %}
<li>
  <a href="{{ post.url }}" class="archive-title">{{ post.title }}</a>
  <span class="archive-tag">{{ post.tags | first }}</span>
  
</li>
{% endfor %}
</ul>

</section>

{% include footer.html %}
