{% include head.html %}<div class="site-layout">
{% include header.html %}

<section>
<article>   
<h2>{{page.title}}</h2>

 <ul class="posts">
    {% for essay in site.essays %}
    <li>
      <a href="{{ essay.url }}">{{ essay.title }}</a>
      {% if essay.date %}<span class="post-date">{{ essay.date | date: '%Y%m%d' }}</span>{% endif %}
    </li>
    {% endfor %}
  </ul>
</article>
</section>
</div>
