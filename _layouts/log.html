{% include head.html %}
{% include header.html %}

<section>

<h2>{{ page.title }}</h2>

<ul class="books-grid">
{% assign log_posts = site.posts | where_exp: "post", "post.tags contains 'log'" | sort: 'date' | reverse %}
{% for post in log_posts %}
<li class="book-card">
{% if post.cover %}
<a href="{{ post.url }}"><img src="{{ post.cover }}" alt="{{ post.title }}"></a>
{% endif %}
<span class="{{ post.status }}">{{ post.status }}</span>
</li>
{% endfor %}
</ul>

</section>
