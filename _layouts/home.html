{% include head.html %}
{% include header.html %}
<section>
{% assign all_posts = site.posts | sort: 'date' | reverse %}
{% for post in all_posts %}
<article class="post {% for tag in post.tags %}tag-{{ tag | slugify }} {% endfor %}">
<a href="{{ post.url }}" class="post-title"><h3>{{ post.title }}</h3></a>
{{ post.content}}
<span class="meta">{{post.tags}} · {{ post.date | date: '%Y%m%d' }} · <a href="mailto:rodrigoturner.carlos@gmail.com?subject={{ post.title }}">Reply by email</a></span>
<hr/>
</article>
{% endfor %}
 {% include footer.html %}
</section>
