{% include head.html %}
{% include header.html %}

<section>


</article>

<ul class="posts">
{% assign all_posts = site.posts | sort: 'date' | reverse %}
{% for post in all_posts %}

<li class="{% for tag in post.tags %}tag-{{ tag | slugify }} {% endfor %}">
<a href="{{ post.url }}" class="post-title"><h3>{{ post.title }}</h3></a>
{{ post.content}}
<span class="tag">{{ post.tags | first }} {{ post.date | date: "%Y%m%d" }}</span>
</li>

{% endfor %}
</ul>

</section>
