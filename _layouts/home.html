<script>


(function () {
  var USER    = "crodrigoturner";
  var API_KEY = "3c7221c1a33da2e9e202e546d4fc36f2";
  var el      = document.getElementById("lastfm-track");

  fetch(
    "https://ws.audioscrobbler.com/2.0/?method=user.getrecenttracks" +
    "&user=" + USER +
    "&api_key=" + API_KEY +
    "&format=json&limit=1"
  )
    .then(function (r) { return r.json(); })
    .then(function (data) {
      var tracks = data.recenttracks.track;
      var track  = Array.isArray(tracks) ? tracks[0] : tracks;
      var now    = track["@attr"] && track["@attr"].nowplaying === "true";
      var artist = track.artist["#text"];
      var name   = track.name;
      el.innerHTML = (now ? "&#9834; " : "") +
        "<i>" + name + "</i> by " + artist;
    })
    .catch(function () {
      el.textContent = "music";
    });
})();
</script>
